<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 337 115" width="337" height="115" fill="none">
  <defs>
    <style>
      .sf-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Montserrat', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 26px;
        fill: #0F172A;
        letter-spacing: -0.2px;
      }
      .sf-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Montserrat', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 16px;
        fill: #0F172A;
        letter-spacing: 3.2px;
      }
    </style>
  </defs>

  <!-- Red Brand Circle -->
  <circle cx="57" cy="57" r="45.5" fill="#FE3030" />

  <!-- Inside Circle: Left Dot -->
  <circle cx="37.5" cy="57" r="6.2" fill="#FFFFFF" />

  <!-- Inside Circle: Forward Chevron Play Symbol -->
  <g stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <line x1="46" y1="82" x2="70" y2="57" opacity="0.85" />
    <line x1="46" y1="32" x2="70" y2="57" opacity="0.85" />
  </g>
  <!-- Bright Center Cap Overlay for depth -->
  <circle cx="70" cy="57" r="7.5" fill="#FFFFFF" />

  <!-- Brand Typography -->
  <text x="115" y="49" class="sf-title">SHORTFUNDLY</text>
  <text x="116" y="76" class="sf-subtitle">OTT MARKETPLACE</text>
</svg>